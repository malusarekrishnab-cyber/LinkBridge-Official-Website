<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | LinkBridge</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 2rem;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
    }
    h1 {
      font-size: 5rem;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(to right, #22d3ee, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    h2 {
      font-size: 1.5rem;
      margin: 1rem 0 0.5rem;
      color: #e2e8f0;
    }
    p {
      color: #94a3b8;
      max-width: 440px;
      margin-bottom: 2rem;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(to right, #06b6d4, #4f46e5);
      color: #020617;
      font-weight: 700;
      text-decoration: none;
      border-radius: 0.75rem;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <img src="/icon.svg" alt="LinkBridge Logo" class="logo">
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page or resource you are looking for does not exist or may have been moved.</p>
  <a href="/" class="btn">Return to LinkBridge Home</a>
</body>
</html>
